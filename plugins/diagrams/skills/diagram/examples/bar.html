<!-- Ejemplo de la skill diagram: barras (type-bar.md) con la misma tinta en coberturas y la barra focal en d-bar. -->
<figure class="figwrap">
  <svg viewBox="0 0 640 220" role="img" aria-labelledby="types-title types-desc">
    <title id="types-title">Referencias por familia</title>
    <desc id="types-desc">De los 45 tipos de diagrama, los de estructura son los más numerosos, seguidos de los gráficos de datos, los de proceso y los de plataforma de datos.</desc>
    <!-- Eje y base -->
    <line class="d-line" x1="56" y1="168" x2="616" y2="168"/>
    <line class="d-dash" x1="56" y1="104" x2="616" y2="104"/>
    <text class="d-tm d-end" x="48" y="108">10</text>
    <line class="d-dash" x1="56" y1="40" x2="616" y2="40"/>
    <text class="d-tm d-end" x="48" y="44">20</text>
    <!-- Barras: 6,4 unidades por tipo; la focal, plena -->
    <rect class="d-bar" x="88" y="52.8" width="96" height="115.2"/>
    <rect class="d-mask" x="120" y="32" width="32" height="16"/>
    <text class="d-tm d-mid" x="136" y="44">18</text>
    <rect class="d-wash-3" x="224" y="91.2" width="96" height="76.8"/>
    <text class="d-tm d-mid" x="272" y="82">12</text>
    <rect class="d-wash-3" x="360" y="110.4" width="96" height="57.6"/>
    <text class="d-tm d-mid" x="408" y="102">9</text>
    <rect class="d-wash-3" x="496" y="129.6" width="96" height="38.4"/>
    <text class="d-tm d-mid" x="544" y="121">6</text>
    <!-- Categorías -->
    <text class="d-sm d-mid" x="136" y="192">Estructura</text>
    <text class="d-sm d-mid" x="272" y="192">Datos</text>
    <text class="d-sm d-mid" x="408" y="192">Proceso</text>
    <text class="d-sm d-mid" x="544" y="192">Plataforma</text>
  </svg>
  <figcaption>La barra plena es el foco; las demás, un lavado al 40 %.</figcaption>
</figure>
